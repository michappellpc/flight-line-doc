<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flight Line Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1d2a1f; color: #f3efe0; font-family: "VT323", "Courier New", monospace; overflow: hidden; touch-action: none; }
  #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud, #stage, #foot { width: min(100vw, calc((100vh - 64px) * 4 / 3), 1040px); }
  #hud { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 6px 10px; background: #2f4a33; border-bottom: 3px solid #1b2b1e; font-family: "Press Start 2P", monospace; font-size: clamp(7px, 1.3vw, 10px); line-height: 1.6; }
  #hud b { color: #ffd966; font-weight: normal; }
  .bar { display: inline-block; width: 60px; height: 8px; background: #1b2b1e; vertical-align: middle; overflow: hidden; border: 1px solid #1b2b1e; }
  .bar i { display: block; height: 100%; background: #7fd36b; }
  #stage { position: relative; aspect-ratio: 4 / 3; }
  canvas#c { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #6aa84f; }
  #obj { position: absolute; left: 6px; top: 6px; max-width: 58%; background: rgba(20,28,22,.82); border: 2px solid #5b4a2b; padding: 3px 8px; font-size: clamp(14px, 2.3vw, 19px); line-height: 1.05; z-index: 3; pointer-events: none; }
  #prompt { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(20,28,22,.88); border: 2px solid #ffd966; padding: 4px 12px; font-family: "Press Start 2P", monospace; font-size: clamp(7px, 1.4vw, 10px); display: none; z-index: 4; white-space: nowrap; }
  #toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); max-width: 90%; background: rgba(20,28,22,.95); border: 2px solid #ffd966; padding: 8px 14px; font-size: clamp(16px, 2.6vw, 22px); display: none; text-align: center; z-index: 20; }
  #foot { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: clamp(13px, 2vw, 17px); color: #b8c4a8; }
  #foot button { font: inherit; background: #5b4a2b; color: #fff3d0; border: 2px solid #2a2118; padding: 1px 10px; cursor: pointer; }
  #modal { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; padding: 8px; }
  #box { background: #f6ecd2; color: #2b2418; border: 4px solid #5b4a2b; box-shadow: 0 0 0 3px #2a2118; padding: 10px 14px 12px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; font-size: clamp(17px, 2.6vw, 21px); line-height: 1.12; }
  .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mtitle h2 { font-family: "Press Start 2P", monospace; font-size: clamp(9px, 1.7vw, 13px); color: #7a2a1a; line-height: 1.5; }
  .mtitle .sub { color: #6b5d3d; }
  canvas.portrait { width: 42px; height: 54px; image-rendering: pixelated; border: 2px solid #5b4a2b; flex: none; }
  #box p { margin: 0 0 6px; }
  #box .tag { color: #6b5d3d; font-size: .9em; }
  #box .vitals { background: #efe1bf; padding: 2px 6px; }
  #box .note-box { background: #e3efd6; border-left: 4px solid #4d6b44; padding: 2px 6px; }
  #box .teach { background: #fff8e1; border-left: 4px solid #c9a15a; padding: 2px 6px; }
  #box .qa { background: #fffaf0; border-left: 3px solid #b9a77a; padding: 2px 6px; margin-bottom: 4px; }
  #box .log { font-size: .9em; color: #4a3f2a; }
  .sec { margin-top: 8px; }
  .sec h3 { font-family: "Press Start 2P", monospace; font-size: clamp(7px, 1.3vw, 9px); color: #5b4a2b; margin-bottom: 4px; line-height: 1.6; }
  button.opt { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; margin-top: 4px; padding: 5px 8px; font: inherit; background: #fff8e1; border: 2px solid #5b4a2b; cursor: pointer; color: inherit; flex-wrap: wrap; }
  button.opt:hover, button.opt:focus { background: #ffe9a8; outline: none; }
  button.opt.hi { background: #ffe39a; border-color: #7a5a1a; }
  button.opt.small { padding: 2px 8px; }
  button.opt:disabled { opacity: .5; cursor: not-allowed; }
  button.opt .k { font-family: "Press Start 2P", monospace; font-size: .5em; color: #7a2a1a; min-width: 1em; }
  button.opt .note { color: #7a6a4a; font-size: .85em; margin-left: auto; }
  .script .line { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .script canvas.portrait { width: 28px; height: 36px; }
  .hearts { color: #d63a3a; letter-spacing: 1px; } .hearts .empty { color: #d9c9a0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tab { font: inherit; padding: 2px 8px; background: #efe1bf; border: 2px solid #5b4a2b; cursor: pointer; color: inherit; }
  .tab.on { background: #5b4a2b; color: #fff3d0; }
  table.roster { width: 100%; border-collapse: collapse; }
  table.roster td, table.roster th { border-bottom: 1px solid #d9c9a0; padding: 2px 4px; text-align: left; vertical-align: top; }
  table.roster .bar { width: 50px; } .bad { color: #a03020; }
  .preview { margin: 4px 0 8px; } .preview canvas.portrait { width: 56px; height: 72px; }
  .field { display: block; margin-bottom: 6px; }
  .field input { font: inherit; padding: 2px 6px; border: 2px solid #5b4a2b; background: #fffaf0; width: 12em; }
  .swatches { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .swatches span { width: 5em; }
  .sw { width: 26px; height: 26px; border: 2px solid #5b4a2b; cursor: pointer; }
  .sw.txt { width: auto; padding: 0 6px; font: inherit; background: #fff8e1; color: inherit; }
  .sw.on { outline: 3px solid #d63a3a; }
  #pad { display: none; }
  @media (max-aspect-ratio: 4/5) { #modal { position: fixed; padding: 12px; } #box { max-height: 92vh; } }
  body.modal-open #pad { display: none !important; }
  @media (pointer: coarse) { #pad { display: block; } #foot .keys { display: none; } }
  .pb { position: fixed; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.5); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; z-index: 30; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"></div>
  <div id="stage">
    <canvas id="c" width="320" height="240"></canvas>
    <div id="obj"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="modal"><div id="box"></div></div>
  </div>
  <div id="foot"><span class="keys">WASD / arrows move · E interact · J journal · 1–9 pick options</span><span>Fictional game. Not medical advice.</span><button id="jbtn">Journal</button></div>
</div>
<div id="pad">
  <div class="pb" data-k="up" style="left:68px;bottom:126px">▲</div>
  <div class="pb" data-k="left" style="left:10px;bottom:68px">◀</div>
  <div class="pb" data-k="right" style="left:126px;bottom:68px">▶</div>
  <div class="pb" data-k="down" style="left:68px;bottom:10px">▼</div>
  <div class="pb" data-k="act" style="right:18px;bottom:46px;width:72px;height:72px">E</div>
  <div class="pb" data-k="menu" style="right:100px;bottom:20px;width:46px;height:46px;font-size:16px">J</div>
</div>
<script src="js/data/people.js"></script>
<script src="js/data/cases.js"></script>
<script src="js/data/cases-flight.js"></script>
<script src="js/data/cases-clinic.js"></script>
<script src="js/data/cases-fitness.js"></script>
<script src="js/data/fdme.js"></script>
<script src="js/data/fdme-more.js"></script>
<script src="js/data/story.js"></script>
<script src="js/data/flights-more.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
